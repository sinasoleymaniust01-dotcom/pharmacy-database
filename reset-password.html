
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور | بانک اطلاعات دارویی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-section">
        <h1>تعیین رمز عبور جدید</h1>

        <form id="resetPasswordForm">
            <label for="newPassword">رمز عبور جدید</label>
            <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="حداقل ۸ کاراکتر"
                required
            >

            <label for="confirmPassword">تکرار رمز عبور</label>
            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="رمز عبور را دوباره وارد کن"
                required
            >

            <button type="submit">ذخیره رمز جدید</button>
            <p id="resetMessage" role="status"></p>
        </form>

        <a href="index.html">بازگشت به صفحه ورود</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        const form = document.getElementById("resetPasswordForm");
        const message = document.getElementById("resetMessage");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (newPassword.value.length < 8) {
                message.textContent = "رمز عبور باید حداقل ۸ کاراکتر باشد.";
                return;
            }

            if (newPassword.value !== confirmPassword.value) {
                message.textContent = "رمزهای عبور با هم مطابقت ندارند.";
                return;
            }

            message.textContent = "در حال ذخیره رمز جدید...";

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword.value
            });

            if (error) {
                console.error("Password reset error:", error);
                message.textContent =
                    "تغییر رمز انجام نشد. ممکن است لینک بازیابی منقضی شده باشد؛ دوباره درخواست بازیابی بده.";
                return;
            }

            message.textContent =
                "رمز عبور با موفقیت تغییر کرد. اکنون می‌توانی به صفحه ورود برگردی.";

            form.reset();
        });
    </script>

</body>
</html>
